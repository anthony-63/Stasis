[package]
name = "stasis"
version = "0.1.0"
edition = "2021"

[dependencies]
sdl3 = { version = "0.14.14", features = ["build-from-source", "image"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"
shaderc = "0.8"
json = "0.12.4"
byteorder = "1.5.0"
bincode = "1.3.3"
gxhash = "3.2.0"

[dependencies.sdl3-image-sys]
version = "0.1"
features = ["no-sdlimage-avif", "no-sdlimage-tif", "no-sdlimage-webp", "no-sdlimage-jxl"]